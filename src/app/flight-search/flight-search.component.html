<form (ngSubmit)="search()" [formGroup]="form">
  <div class="form-group">
    <label>From:</label>
    <input class="form-control" formControlName="from" />
    <form-error [errors]="form.controls['from'].errors"></form-error>
  </div>
  <div class="form-group">
    <label>To:</label>
    <input class="form-control" formControlName="to" />
    <form-error [errors]="form.controls['to'].errors"></form-error>
  </div>

  <div class="form-group">
    @if(form.hasError('roundtrip')) {
    <p>Rundumflüge sind unzulässig.</p>
    }
    <button class="btn btn-default" [disabled]="form.invalid">Search</button>
  </div>
</form>

<p>{{ prettySearch() }}</p>

@for(flight of flights(); track $index) {
<flight-card [item]="flight" [(selected)]="basket[flight.id]">

} @if (selectedFlight(); as flight) {
<form (ngSubmit)="save(flight)">
  <div class="form-group">
    <label>From:</label>
    <input [(ngModel)]="flight.from" name="from" class="form-control" />
  </div>
  <div class="form-group">
    <label>To:</label>
    <input [(ngModel)]="flight.to" name="to" class="form-control" />
  </div>

  <div class="form-group">
    <button class="btn btn-default">Save</button>
  </div>
</form>
}
