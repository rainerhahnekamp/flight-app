<div class="header">
  <h2 class="title">Flight Search</h2>
</div>

<form>
  <div class="form-group">
    <label for="from">From:</label>
    <input [(ngModel)]="from" id="from" name="from" class="form-control" />
  </div>
  <div class="form-group">
    <label for="to">To:</label>
    <input [(ngModel)]="to" id="to" name="to" class="form-control" />
  </div>

  <div class="form-group">
    <button (click)="search()" class="btn btn-default">Search</button>
    <button (click)="delay()" class="btn btn-default">Delay</button>
    <button (click)="logSignal()" class="btn btn-default">Log Signal</button>
  </div>
</form>

<!--<p>{{ prettySearch() }}</p>-->
@if (flights.hasValue()) {
<div class="row">
  @for (flight of flights.value(); track flight.id) {
  <div class="col-xs-12 col-sm-6 col-md-4 col-lg-3">
    <app-flight-card [item]="flight" [(selected)]="basket[flight.id]">
      <p class="middle"><i>Delays are possible!</i></p>
      <p class="bottom"><small>Statement without guarantee!</small></p>
    </app-flight-card>
  </div>
  }
</div>
} @else if (flights.isLoading()) {
<p>Wir laden...</p>
} @else if (flights.error()) {
<p>Es trat ein Fehler auf: {{ flights.error() | json }}</p>
}
